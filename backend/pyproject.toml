[project]
name = "permission-aware-rag"
version = "0.1.0"
description = "Backend for the permission-aware multi-tenant RAG platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "argon2-cffi>=23.1.0",
    "python-dotenv>=1.0.1",
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "pypdf>=5.2.0",
    "sentence-transformers>=3.3.1",
    "qdrant-client>=1.12.1,<1.14",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
